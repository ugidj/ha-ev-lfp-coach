[project]
name = "ha-ev-lfp-coach"
version = "0.1.2"
description = "Home Assistant custom integration that calibrates and manages LFP EV batteries."
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = ["real_number: keep Home Assistant's own number.set_value instead of mocking it"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.coverage.run]
source = ["custom_components/ev_lfp_coach"]
